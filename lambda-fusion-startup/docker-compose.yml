services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-lambda_cloud}"
      MYSQL_USER: "${MYSQL_USERNAME:-lambda_fusion}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  pgvector:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      POSTGRES_DB: "${POSTGRES_DATABASE:-lambda_ai}"
      POSTGRES_USER: "${POSTGRES_USERNAME:-lambda_fusion}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/10-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}"
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  startup:
    image: lambda-fusion-startup:${STARTUP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Duser.home=/opt/lambda-fusion/data -Duser.timezone=${TZ:-Asia/Shanghai}"
      MAIN_DB_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      MAIN_DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-lambda_cloud}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true"
      MAIN_DB_USERNAME: "${MYSQL_USERNAME:-lambda_fusion}"
      MAIN_DB_PASSWORD: "${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}"
      AI_DB_DRIVER_CLASS_NAME: org.postgresql.Driver
      AI_DB_URL: "jdbc:postgresql://pgvector:5432/${POSTGRES_DATABASE:-lambda_ai}"
      AI_DB_USERNAME: "${POSTGRES_USERNAME:-lambda_fusion}"
      AI_DB_PASSWORD: "${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"
      REDIS_DATABASE: "${REDIS_DATABASE:-0}"
      AI_WORKSPACE_STORAGE_TYPE: MYSQL
      AI_RAG_ENABLED: "true"
      AI_RAG_STORE_TYPE: PGVECTOR
      AI_PGVECTOR_JDBC_URL: "jdbc:postgresql://pgvector:5432/${POSTGRES_DATABASE:-lambda_ai}"
      AI_PGVECTOR_USERNAME: "${POSTGRES_USERNAME:-lambda_fusion}"
      AI_PGVECTOR_PASSWORD: "${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}"
      AI_PGVECTOR_SCHEMA: public
      AI_KB_STORAGE_TYPE: OSS
      AI_KB_OSS_CLIENT: default
      AI_KB_OSS_PREFIX: ai/knowledge/
      CRYPTO_AES_SECRET_KEY: "${CRYPTO_AES_SECRET_KEY:?请在 .env 中设置 CRYPTO_AES_SECRET_KEY}"
      AI_ATTACHMENT_PREVIEW_SECRET: "${AI_ATTACHMENT_PREVIEW_SECRET:?请在 .env 中设置 AI_ATTACHMENT_PREVIEW_SECRET}"
      AI_QWEN_IMAGE_TOOL_ENABLED: "${AI_QWEN_IMAGE_TOOL_ENABLED:-false}"
      AI_QWEN_IMAGE_API_KEY: "${AI_QWEN_IMAGE_API_KEY:-}"
      AI_QWEN_IMAGE_BASE_URL: "${AI_QWEN_IMAGE_BASE_URL:-}"
      AI_QWEN_IMAGE_MODEL_NAME: "${AI_QWEN_IMAGE_MODEL_NAME:-qwen-image-3.0-pro}"
      AI_QWEN_IMAGE_CONNECT_TIMEOUT_SECONDS: "${AI_QWEN_IMAGE_CONNECT_TIMEOUT_SECONDS:-10}"
      AI_QWEN_IMAGE_REQUEST_TIMEOUT_SECONDS: "${AI_QWEN_IMAGE_REQUEST_TIMEOUT_SECONDS:-120}"
      AI_SCHEDULE_CLUSTERED: "false"
      OSS_TYPE: MINIO
      OSS_CDN: "http://localhost:${MINIO_API_PORT:-9000}"
      OSS_ENDPOINT: http://minio:9000
      OSS_ACCESS_KEY: "${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER}"
      OSS_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}"
      OSS_BUCKET: "${MINIO_BUCKET:-lambda-fusion}"
      OSS_REGION: us-east-1
      OSS_HTTPS: "false"
      OSS_PATH_STYLE: "true"
      OSS_ACCESS_POLICY: public
    ports:
      - "${APP_PORT:-20005}:20005"
    volumes:
      - startup-data:/opt/lambda-fusion/data

volumes:
  mysql-data:
  pgvector-data:
  redis-data:
  minio-data:
  startup-data:
