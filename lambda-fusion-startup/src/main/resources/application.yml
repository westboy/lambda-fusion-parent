################################# Server 配置 #################################
server:
  port: 20005
  tomcat:
    max-connections: 2000
    keep-alive-timeout: 300000
################################# Springboot 配置 #################################
spring:
  reactor:
    debug-agent:
      enabled: true
  application:
    name: lambda-fusion-admin
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          #### Mysql 环境变量 ####
          driver-class-name: ${MAIN_DB_DRIVER_CLASS_NAME}
          url: ${MAIN_DB_URL}
          username: ${MAIN_DB_USERNAME}
          password: ${MAIN_DB_PASSWORD}
        ai-postgres:
          #### PostgresSql 环境变量 ####
          driver-class-name: ${AI_DB_DRIVER_CLASS_NAME}
          url: ${AI_DB_URL}
          username: ${AI_DB_USERNAME}
          password: ${AI_DB_PASSWORD}
  data:
    redis:
      #### Redis 环境变量 ####
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
  threads:
    virtual:
      enabled: true
  #### Quartz 定时任务调度：JDBC JobStore 持久化到主库 master + 集群;QRTZ_* 表由 Spring 自动建(initialize-schema=always) ####
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.threadCount: ${AI_SCHEDULE_THREAD_POOL_SIZE:4}
      #### 集群属性仅对 jdbc JobStore 生效;数据源由 AiConfigure 显式注入主库底层 ds ####
      org.quartz.jobStore.isClustered: ${AI_SCHEDULE_CLUSTERED:true}
      org.quartz.jobStore.clusterCheckinInterval: 20000
logging:
  level:
    io:
      agentscope.extensions: error
      lettuce: error
    com:
      zaxxer: error
    p6spy: ${P6SPY_LOG_LEVEL:warn}
    root: info
################################# Mybatis-plus 配置 #################################
mybatis-plus:
  tenant:
    enabled: ${MYBATIS_PLUS_TENANT_ENABLED:true}
  configuration:
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-package: com.fusion.startup.*.mapper
################################# Lambda 配置 #################################
lambda:
  #### 缓存：表元数据内省短 TTL（DDL 变更后最长 60s 生效）；类型默认 REDIS，无 Redis 时可切 CAFFEINE ####
  cache:
    caches:
      formTableMeta:
        ttl: 60s
        l1-ttl: 60s
    type: caffeine
    enabled: true
  #### 加解密组件：AES 密钥 Base64 编码，生产必须经 CRYPTO_AES_SECRET_KEY 注入（openssl rand -base64 32） ####
  crypto:
    keys:
      - id: default
        type: AES
        secret-key: ${CRYPTO_AES_SECRET_KEY:ZGV2LW9ubHktMzJieXRlLWtleS1wbGFjZWhvbGRlciE=}
      #### 登录凭据传输加密 RSA 密钥对，必须经环境变量注入（见 .env.example 生成命令），不配 dev 占位 ####
      - id: login
        type: RSA
        public-key: ${CRYPTO_LOGIN_PUBLIC_KEY}
        private-key: ${CRYPTO_LOGIN_PRIVATE_KEY}
  #### 单机 Lucene 全文索引；多实例部署应关闭并改用共享检索服务 ####
  lucene:
    enabled: ${AI_LUCENE_ENABLED:true}
    directory: ${AI_LUCENE_DIRECTORY:${user.home}/.agentscope/fusion/rag/lucene}
  fusion:
    form:
      # 动态表单可映射的物理表 = 排除平台内部表后的全部表（默认排除集见 FormProperties：
      # la_ 前缀除 la_demo_* 演示表外均属平台内部表，另含 ai_*/flow_* 与 Liquibase/Quartz 系统表；
      # 可经 lambda.fusion.form.table-exclude-pattern 覆盖）
    permission:
      server:
        auth-token: 111
      mode: server
    #### 权限密码策略：CIPHERTEXT 使新增用户时前端传入的密码即登录密码 ####
    #### （RANDOM 默认会丢弃表单密码改存随机值，导致新增后无法用表单密码登录）####
    #### 未传密码的场景（如重置密码）回退 md5f2(customize) 并由接口返回可登录密码 ####
    authorize:
      password-strategy:
        mode: ${AUTHORIZE_PASSWORD_STRATEGY_MODE:ciphertext}
        #### 密码有效期（默认关闭）：过期后登录将强制跳转修改密码页（dev/admin/tenantManager 豁免）####
        enable-period-change: ${AUTHORIZE_ENABLE_PERIOD_CHANGE:false}
        period-change-days: ${AUTHORIZE_PERIOD_CHANGE_DAYS:90}
        #### 密码即将过期的提前提醒天数，进入窗口后铃铛显示剩余天数 ####
        remind-days: ${AUTHORIZE_PERIOD_REMIND_DAYS:7}
    config:
      auto-refresh:
        enabled: true
      datasource:
        #### Mysql 环境变量 ####
        driver-class-name: ${MAIN_DB_DRIVER_CLASS_NAME}
        url: ${MAIN_DB_URL}
        username: ${MAIN_DB_USERNAME}
        password: ${MAIN_DB_PASSWORD}
    #### 工作流模块（warm-flow 引擎）：引擎全局开关见顶层 warm-flow 配置 ####
    workflow:
      enabled: ${WORKFLOW_ENABLED:true}
    ai:
      #### AgentScope Workspace：LOCAL 单节点；JDBC 多节点共享。切换后不迁移旧数据 ####
      workspace:
        storage:
          type: ${AI_WORKSPACE_STORAGE_TYPE:JDBC}
          jdbc:
            datasource: ${AI_WORKSPACE_MYSQL_DATASOURCE:master}
      #### WORKSPACE 自演化长期记忆：默认每 10 分钟最多刷新一次 ####
      memory:
        flush:
          mode: ${AI_MEMORY_FLUSH_MODE:THROTTLED}
          min-gap: ${AI_MEMORY_FLUSH_MIN_GAP:10m}
      state-store:
        type: MYSQL
        mysql:
          database: lambda_cloud
      #### 定时任务调度：JDBC JobStore 持久化(数据源默认主库 master,见 spring.quartz) ####
      schedule:
        enabled: ${AI_SCHEDULE_ENABLED:false}
        datasource: ${AI_SCHEDULE_DATASOURCE:master}
      #### 独立普通 Agent 工具；不关联应用媒体模型或 Skill ####
      tools:
        qwen-image:
          enabled: ${AI_QWEN_IMAGE_TOOL_ENABLED:true}
          api-key: ${AI_QWEN_IMAGE_API_KEY:}
          base-url: ${AI_QWEN_IMAGE_BASE_URL:}
          model-name: ${AI_QWEN_IMAGE_MODEL_NAME:qwen-image-3.0-pro}
          connect-timeout-seconds: ${AI_QWEN_IMAGE_CONNECT_TIMEOUT_SECONDS:10}
          request-timeout-seconds: ${AI_QWEN_IMAGE_REQUEST_TIMEOUT_SECONDS:120}
      #### 对话附件与工具生成媒体（生产请配 AI_ATTACHMENT_PREVIEW_SECRET） ####
      chat:
        attachment:
          #### 每条消息完整内联的附件正文总预算；超出后由 Agent 按需搜索/分段读取 ####
          max-inline-chars: ${AI_CHAT_ATTACHMENT_MAX_INLINE_CHARS:8000}
          #### 附件读取工具单次返回的正文字符上限 ####
          max-tool-read-chars: ${AI_CHAT_ATTACHMENT_MAX_TOOL_READ_CHARS:4000}
          preview:
            secret: ${AI_ATTACHMENT_PREVIEW_SECRET:dev-only-please-change-attachment-preview-secret}
          generated-media:
            max-file-size-mb: ${AI_TOOL_MEDIA_MAX_FILE_SIZE_MB:100}
            connect-timeout-seconds: ${AI_TOOL_MEDIA_CONNECT_TIMEOUT_SECONDS:10}
            request-timeout-seconds: ${AI_TOOL_MEDIA_REQUEST_TIMEOUT_SECONDS:120}
            max-redirects: ${AI_TOOL_MEDIA_MAX_REDIRECTS:3}
        #### 对话运行参数（均可省略使用默认值） ####
        run:
          #### 是否推送 Agent 推理过程(ThinkingBlock)事件，默认 true ####
          enable-reasoning: ${AI_CHAT_ENABLE_REASONING:true}
      #### 知识库(RAG)：默认关闭；pgvector 连接默认复用 ai-postgres 环境变量 ####
      rag:
        enabled: ${AI_RAG_ENABLED:true}
        #### 新建知识库默认内容检索策略：FULL_TEXT/VECTOR/HYBRID ####
        default-retrieval-mode: ${AI_RAG_DEFAULT_RETRIEVAL_MODE:VECTOR}
        #### 向量库后端：MEMORY(进程内)/PGVECTOR/OCEANBASE(OceanBase MySQL 模式) ####
        store:
          type: ${AI_RAG_STORE_TYPE:PGVECTOR}
          pg-vector:
            jdbc-url: ${AI_PGVECTOR_JDBC_URL:${AI_DB_URL}}
            username: ${AI_PGVECTOR_USERNAME:${AI_DB_USERNAME}}
            password: ${AI_PGVECTOR_PASSWORD:${AI_DB_PASSWORD}}
            schema: ${AI_PGVECTOR_SCHEMA:public}
          ocean-base:
            jdbc-url: ${AI_OCEANBASE_JDBC_URL:${AI_DB_URL}}
            username: ${AI_OCEANBASE_USERNAME:${AI_DB_USERNAME}}
            password: ${AI_OCEANBASE_PASSWORD:${AI_DB_PASSWORD}}
        #### AI 文件存储：知识库原文件、聊天附件、工具生成媒体共用 LOCAL/OSS 后端 ####
        document-storage:
          type: ${AI_KB_STORAGE_TYPE:OSS}
          local:
            root: ${AI_KB_STORAGE_ROOT:}
          oss:
            client-name: ${AI_KB_OSS_CLIENT:default}
            key-prefix: ${AI_KB_OSS_PREFIX:ai/knowledge/}
  oss:
    clients:
      #### Oss 环境变量 ####
      - name: default
        type: ${OSS_TYPE:QINIU}
        cdn: ${OSS_CDN:${QINIU_CDN}}
        endpoint: ${OSS_ENDPOINT:https://s3.cn-north-1.qiniucs.com}
        accessKey: ${OSS_ACCESS_KEY:${QINIU_ACCESS_KEY}}
        secretKey: ${OSS_SECRET_KEY:${QINIU_SECRET_KEY}}
        bucket: ${OSS_BUCKET:${QINIU_BUCKET}}
        region: ${OSS_REGION:${QINIU_REGION}}
        isHttps: ${OSS_HTTPS:false}
        enablePathStyleAccess: ${OSS_PATH_STYLE:false}
        accessPolicy: ${OSS_ACCESS_POLICY:public}
  liquibase:
    enabled: true
    #### Mysql 环境变量 ####
    driver-class-name: ${MAIN_DB_DRIVER_CLASS_NAME}
    url: ${MAIN_DB_URL}
    username: ${MAIN_DB_USERNAME}
    password: ${MAIN_DB_PASSWORD}
  api-docs:
    enabled: true
    title: ${spring.application.name}
  security:
    verify:
      dev-mode: true
      url: /auth/jcaptcha
    hmac:
      enabled: true
      clients:
        - appid: 123
          secret: 123456
    sa-token:
      # 匿名放行：开放接口、WebSocket、附件签名预览/下载直链、发布应用公开名片。
      # 注意：框架 SaInterceptor 以 isAnnotation(false) 构建（不识别 @SaIgnore），
      # 匿名路径必须经此 ignored 列表放行；仅放行 profile 名片，access 仍需登录鉴权。
      # warm-flow 设计器静态页放行（iframe 文档请求无法带 header）；
      # 数据接口 /warm-flow/** 不放行——设计器经 URL Authorization 参数携带登录态（designer/index.vue）
      ignored: /open/**,/ws/**,/v1/ai/chat/attachments/*/preview,/v1/ai/chat/attachments/*/file,/v1/ai/public/apps/*/profile,/auth/public-key,/warm-flow-ui/**
      check-same-token: false
      max-login-count: 5
      is-concurrent: true
    xss-protected:
      enabled: false
      trusted: /test/**
    form:
      enabled: true
      login-processing-url: /auth/login
      credentials-encrypt:
        enabled: true
        key-id: login
      captcha-trigger:
        enabled: true
        failure-trigger-times: 2
      lock-strategy:
        failure-max-times: 10
      logout:
        logout-url: /auth/logout
    sms:
      enabled: true
      enable-verify: true
  sms:
    aliyun:
      enabled: true
      #### 阿里云短信 环境变量 ####
      accessKeyId: ${ALIYUN_SMS_ACCESS_KEY_ID:10000000}
      accessKeySecret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:10000000}
  sse:
    enable-endpoint: true
    timeout: 300000


################################# warm-flow 工作流引擎 #################################
warm-flow:
  banner: false
  #### 设计器 UI 静态资源（/warm-flow-ui/**）与数据接口（/warm-flow/**）开关。
  #### 生产环境可经 WORKFLOW_UI_ENABLED=false 关闭设计器入口 ####
  ui: ${WORKFLOW_UI_ENABLED:true}
  framework: spring_boot
  token-name: Authorization

